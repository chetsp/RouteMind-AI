name: Validate
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: routemind
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: routemind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U routemind -d routemind_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: SQLite tests
        if: matrix.database == 'sqlite'
        run: pytest -q
      - name: PostgreSQL tests
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://routemind:test-only@127.0.0.1:5432/routemind_test
        run: pytest -q
      - name: Synthetic evaluations
        if: matrix.database == 'sqlite'
        run: |
          EMBEDDING_BACKEND=hash python -m evaluations.run
          EMBEDDING_BACKEND=minilm python -m evaluations.run
      - name: Actual MiniLM integration
        if: matrix.database == 'sqlite'
        run: RUN_SEMANTIC_TESTS=1 pytest tests/test_semantic.py -q
      - name: Group-split NLP and policy quality evaluation
        if: matrix.database == 'sqlite'
        run: python -m evaluations.quality.run --split test --backend minilm --output evaluations/quality-ci.json
      - uses: actions/upload-artifact@v4
        if: matrix.database == 'sqlite'
        with:
          name: synthetic-benchmark-results
          path: |
            evaluations/results*.json
            evaluations/quality-ci.json
