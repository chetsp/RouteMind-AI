[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "routemind-ai"
version = "0.1.0"
description = "Auditable synthetic ground freight planning with retrieval and deterministic routing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4", "chromadb>=1,<2", "langgraph>=1,<2",
  "pydantic-ai-slim[openai,google]>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
semantic = ["sentence-transformers>=3,<6"]
ui-test = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
